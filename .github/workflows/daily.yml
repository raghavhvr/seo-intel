name: Daily trend ingest + retrain

on:
  schedule:
    - cron: "15 6 * * *"   # 06:15 UTC every day
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: trendpulse-daily
  cancel-in-progress: false

jobs:
  trendpulse:
    runs-on: ubuntu-latest
    # Secrets are read from this GitHub Environment (Settings -> Environments
    # -> "trendpulse" -> Environment secrets). Repo-level Actions secrets work
    # too. The workflow file itself never contains key material — the
    # `${{ secrets.* }}` references resolve at runtime, encrypted at rest and
    # masked in logs.
    environment: trendpulse
    steps:
      # GITHUB_TOKEN is injected automatically by GitHub Actions — there is
      # nothing to configure for it.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ALL secrets below are OPTIONAL. Unset ones resolve to empty strings
      # and the matching feature simply skips (Profound collector, Slack/Teams
      # briefing) — the run itself always proceeds.
      - name: Ingest, retrain, report
        env:
          # TryProfound Enterprise API key (GEO visibility for adcb.com)
          PROFOUND_API_KEY: ${{ secrets.PROFOUND_API_KEY }}
          # PROFOUND_CATEGORY_ID: ${{ secrets.PROFOUND_CATEGORY_ID }}  # pin to skip auto-discovery
          # Morning briefing + breakout alerts
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python -m trendpulse run-daily --config config.yaml

      # Only the compressed snapshot is committed: the raw DB crossed
      # GitHub's hard 100 MB file limit on 2026-08-17 and every push was
      # rejected. Gzip keeps it ~5x smaller, and `trendpulse` inflates
      # data/trendpulse.db.gz automatically wherever the raw file is absent.
      - name: Compress the DB snapshot for commit
        run: python -m trendpulse pack --config config.yaml

      - name: Commit fresh data, models and reports
        # Commit FIRST, then rebase, then push. Rebasing before committing
        # fails ("cannot pull with rebase: You have unstaged changes") because
        # the run has just modified data/ and reports/ — and the old `|| true`
        # hid that failure, so any push to main during the run (a merged PR)
        # made the final push a guaranteed non-fast-forward rejection. The
        # retry loop covers pushes landing while this step itself runs.
        run: |
          git config user.name "trendpulse-bot"
          git config user.email "trendpulse-bot@users.noreply.github.com"
          git add data/ reports/ docs/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: daily trend ingest + model retrain ($(date -u +%F))"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin "${{ github.ref_name }}"; then
              # Binary conflict on the DB snapshot: someone pushed an import
              # while this run was ingesting. Git can't merge binaries, but
              # SQLite can — resolve to the row-level UNION of both versions
              # so neither the pushed import nor this run's ingest is lost.
              # (:2 = the upstream/main version during a rebase.) The raw
              # data/trendpulse.db is untracked, so it still holds this run's
              # rows; merge the remote's rows in, then re-pack the snapshot.
              git show :2:data/trendpulse.db.gz | gunzip > /tmp/remote-trendpulse.db
              git checkout --theirs -- data/ reports/ docs/
              python - <<'PYEOF'
          import sqlite3
          con = sqlite3.connect("data/trendpulse.db")
          con.execute("ATTACH '/tmp/remote-trendpulse.db' AS remote")
          tables = [r[0] for r in con.execute(
              "SELECT name FROM remote.sqlite_master"
              " WHERE type='table' AND name NOT LIKE 'sqlite_%'")]
          for table in tables:
              con.execute(f'INSERT OR REPLACE INTO main."{table}"'
                          f' SELECT * FROM remote."{table}"')
          con.commit()
          print("merged remote DB rows into this run's DB:", tables)
          PYEOF
              python -m trendpulse pack --config config.yaml
              git add data/ reports/ docs/
              GIT_EDITOR=true git rebase --continue
            fi
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — remote moved; rebasing again"
            sleep 5
          done
          echo "giving up after 3 attempts" >&2
          exit 1
