name: Daily trend ingest + retrain

on:
  schedule:
    - cron: "15 6 * * *"   # 06:15 UTC every day
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: trendpulse-daily
  cancel-in-progress: false

jobs:
  trendpulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest, retrain, report
        env:
          # Optional — create a free Reddit script app for reliable access
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Optional — TryProfound Enterprise API key (GEO visibility for adcb.com)
          PROFOUND_API_KEY: ${{ secrets.PROFOUND_API_KEY }}
          # PROFOUND_CATEGORY_ID: ${{ secrets.PROFOUND_CATEGORY_ID }}  # pin to skip auto-discovery
          # Optional — morning briefing + breakout alerts
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python -m trendpulse run-daily --config config.yaml

      - name: Commit fresh data, models and reports
        run: |
          git config user.name "trendpulse-bot"
          git config user.email "trendpulse-bot@users.noreply.github.com"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git add data/ reports/
          git diff --cached --quiet || git commit -m "chore: daily trend ingest + model retrain ($(date -u +%F))"
          git push
