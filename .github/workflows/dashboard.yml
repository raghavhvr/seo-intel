name: Rebuild dashboard on design changes

# Design iterations shouldn't wait for the ~40-minute daily data run: when the
# dashboard generator (or the config that feeds it) changes on main, re-render
# the page from the data already committed and push it. GitHub Pages picks the
# commit up within a couple of minutes.
#
# No retrigger loop: this workflow's own commit touches docs/ and reports/
# only, which never match the paths filter below.

on:
  push:
    branches: [main]
    paths:
      - "trendpulse/dashboard.py"
      - "config.yaml"

permissions:
  contents: write

# Same group as the daily run so the two never race each other's pushes.
concurrency:
  group: trendpulse-daily
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Re-render dashboard from committed data
        run: python -m trendpulse dashboard --config config.yaml

      - name: Commit the refreshed page
        run: |
          git config user.name "trendpulse-bot"
          git config user.email "trendpulse-bot@users.noreply.github.com"
          git add docs/ reports/dashboard.html
          if git diff --cached --quiet; then
            echo "dashboard unchanged"
            exit 0
          fi
          git commit -m "chore: re-render dashboard"
          git pull --rebase origin main
          git push
